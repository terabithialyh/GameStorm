      function startMatch() {
        resetMatch();
        state.mode = "match";
        state.match.running = true;
        state.lastTick = now();
        updateHud();
      }

      function endMatch(success) {
        state.match.running = false;
        state.mode = "result";
        audio.buzz();
        const chapter = CAMPAIGN[state.chapterIndex];
        if (success) {
          // 小幅成长：命中越多，奖励越高
          const acc = state.match.shots > 0 ? state.match.makes / state.match.shots : 0;
          const gain = Math.round(3 + acc * 7);
          state.rating = clamp(state.rating + gain, 50, 99);
          openStory(chapter.post);
          // 在 post 的最后一句点“开始比赛”会进入下一章
          // 这里用 story 的 next 来控制
          state._afterStory = "advance";
        } else {
          openStory([
            { speaker: "旁白", avatar: "⏱️", text: "哨声响起。分数还差一点点。再来一场，把节奏找回来。", },
            { speaker: "教练", avatar: "🧔‍♂️", text: "别低头。调整出手点，稳住力量。重开本场。", },
          ]);
          state._afterStory = "retry";
        }
      }

      // ====== 输入映射 ======
      function screenToCourt(sx, sy) {
        // 近似映射：屏幕下方更靠近你（z 更大），上方更靠近篮筐（z 更小）
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;
        const nx = (sx / w) * 2 - 1;
        const ny = sy / h; // 0..1
        const x = nx * (WORLD.COURT_W * 0.48);
        const z = lerp(WORLD.COURT_L * 0.92, WORLD.COURT_L * 0.18, clamp(ny, 0, 1));
        return vec3(clamp(x, -WORLD.COURT_W * 0.48, WORLD.COURT_W * 0.48), WORLD.BALL_R, clamp(z, 0.2, WORLD.SHOOT_Z_MAX));
      }

      function rayFromScreen(sx, sy) {
        // 把屏幕坐标（CSS px）转换为世界坐标射线（相机坐标系 -> 世界坐标）
        // 用于把手指起点/终点可靠地映射到球场平面，避免 offsetX/缩放带来的偏移。
        // 使用缓存的 dpr，确保与 computeProjectionMap 时一致
        const dpr = projectionMap.dpr || 1;
        const px = sx * dpr;
        const py = sy * dpr;
        const cx = canvas.width * 0.5;
        const cy = canvas.height * 0.58;

        const { forward, right, up } = camera.basis;
        const dx = (px - cx) / camera.f;
        const dy = (cy - py) / camera.f;
        const dir = vnorm(vadd(vadd(vmul(right, dx), vmul(up, dy)), forward));
        return { origin: camera.pos, dir };
      }

      function screenToCourtWorld(sx, sy, yPlane, clampToCourt = true) {
        // 首选：使用单应逆变换（与地板四边形严格对齐）
        if (projectionMap.ready && projectionMap.Hinv) {
          // 使用缓存的 dpr，确保与 computeProjectionMap 时一致
          const dpr = projectionMap.dpr || 1;
          const px = sx * dpr;
          const py = sy * dpr;
          const w = applyHomography(projectionMap.Hinv, px, py);
          if (w) {
            if (clampToCourt) {
              return vec3(
                clamp(w.x, -WORLD.COURT_W * 0.48, WORLD.COURT_W * 0.48),
                yPlane,
                clamp(w.y, 0.2, WORLD.SHOOT_Z_MAX),
              );
            }
            return vec3(w.x, yPlane, w.y);
          }
        }

        // 回退：射线与 y = yPlane（球场平面）求交
        const ray = rayFromScreen(sx, sy);
        if (!ray) return null;
        if (Math.abs(ray.dir.y) < 1e-6) return null;
        const t = (yPlane - ray.origin.y) / ray.dir.y;
        if (t <= 0) return null;
        const hit = vadd(ray.origin, vmul(ray.dir, t));
        if (clampToCourt) {
          return vec3(
            clamp(hit.x, -WORLD.COURT_W * 0.48, WORLD.COURT_W * 0.48),
            yPlane,
            clamp(hit.z, 0.2, WORLD.SHOOT_Z_MAX),
          );
        }
        return vec3(hit.x, yPlane, hit.z);
      }

      const INPUT = Object.freeze({
        TAP_MAX_MS: 170,
        TAP_MAX_PX: 12,
        LONGPRESS_MS: 280,
        LONGPRESS_MAX_PX: 10,
      });

      function swipeToVelocity(sx, sy, ex, ey, dtMs, fromPos, preview = false) {
        const dx = ex - sx;
        const dy = ey - sy;
        const dist = Math.hypot(dx, dy);
        const dt = clamp(dtMs / 1000, 0.04, 0.35);
        const speedPx = dist / dt;

        const smoothstep = (a, b, x) => {
          const t = clamp((x - a) / (b - a), 0, 1);
          return t * t * (3 - 2 * t);
        };

        // 手势投篮：x 偏移控制左右方向，y 偏移控制弧度/力量
        const rect = canvas.getBoundingClientRect();
        const maxDx = Math.max(140, rect.width * 0.45);
        const maxDy = Math.max(160, rect.height * 0.6);
        const dx01 = clamp(dx / maxDx, -1, 1);
        const dyUp = clamp(sy - ey, 0, maxDy);
        const pLen = smoothstep(10, maxDy, dyUp);
        const pSpd = smoothstep(420, 2400, speedPx);
        const power01 = Math.pow(clamp(pLen * 0.75 + pSpd * 0.25, 0, 1), 0.9);

        const baseDir = vnorm(vec3(WORLD.HOOP.x - fromPos.x, 0, WORLD.HOOP.z - fromPos.z));
        const maxAngle = Math.PI * 0.16;
        const ang = dx01 * maxAngle;
        const cosA = Math.cos(ang);
        const sinA = Math.sin(ang);
        const dir = vnorm(vec3(baseDir.x * cosA - baseDir.z * sinA, 0, baseDir.x * sinA + baseDir.z * cosA));

        // 距离补偿：投得更远，需要更高的初速度/弧线
        const d = Math.hypot(fromPos.x - WORLD.HOOP.x, fromPos.z - WORLD.HOOP.z);
        const distFactor = clamp((d - 2.5) / 10.0, 0, 1);

        const rating01 = clamp((state.rating - 50) / 50, 0, 1);
        // 手势模式下，尽量少“自动修正”，只保留很轻微的散布（越强力、能力越高越稳）
        const maxErr = (lerp(0.16, 0.05, rating01) + (1 - power01) * 0.06) * 0.7;
        const err = 0;
        const cos = Math.cos(err);
        const sin = Math.sin(err);
        const dirErr = vnorm(vec3(dir.x * cos - dir.z * sin, 0, dir.x * sin + dir.z * cos));

        // 水平初速度：根据力量和距离，限制上限避免“火箭球”
        const baseH = lerp(7.0, 12.6, power01) + distFactor * 2.1;
        const vH = clamp(baseH, 6.2, 16.8);

        // 垂直初速度：随距离更“抛”，随力量更高
        const baseV = lerp(7.4, 16.2, power01) + distFactor * 3.4;
        const vy = clamp(baseV, 6.8, 19.2);

        const vx = dirErr.x * vH;
        const vz = dirErr.z * vH;
        return vec3(vx, vy, vz);
      }

      function enterFirstPerson(fromPos) {
        if (state.firstPerson.active) return;
        state.firstPerson.saved = {
          pos: vec3(camera.pos.x, camera.pos.y, camera.pos.z),
          target: vec3(camera.target.x, camera.target.y, camera.target.z),
        };
        const target = vec3(WORLD.HOOP.x, WORLD.HOOP.y + 0.1, WORLD.HOOP.z);
        const forward = vnorm(vsub(target, fromPos));
        const back = 0.6;
        const up = 0.35;
        camera.pos = vec3(fromPos.x - forward.x * back, fromPos.y + up, fromPos.z - forward.z * back);
        camera.target = target;
        computeCameraBasis();
        computeProjectionMap();
        state.firstPerson.active = true;
      }

      function exitFirstPerson() {
        if (!state.firstPerson.active || !state.firstPerson.saved) return;
        camera.pos = vec3(state.firstPerson.saved.pos.x, state.firstPerson.saved.pos.y, state.firstPerson.saved.pos.z);
        camera.target = vec3(state.firstPerson.saved.target.x, state.firstPerson.saved.target.y, state.firstPerson.saved.target.z);
        state.firstPerson.saved = null;
        computeCameraBasis();
        computeProjectionMap();
        state.firstPerson.active = false;
      }

      function getAimOrigin(fromPos) {
        return fromPos;
      }

      function autoAimVelocityAndChance(fromPos) {
        // 纯物理自动瞄准：通过网格搜索找到能进球的初速度
        // 模拟包含篮筐碰撞，与实际物理一致

        const hoopX = WORLD.HOOP.x;
        const hoopY = WORLD.HOOP.y;
        const hoopZ = WORLD.HOOP.z;
        const g = PHYS.G;

        const horizontalDist = Math.hypot(fromPos.x - hoopX, fromPos.z - hoopZ);
        const dist01 = clamp((horizontalDist - 2.0) / 10.0, 0, 1);

        // 完整模拟函数，包含篮筐碰撞
        const simulateFull = (v0) => {
          const ball = {
            pos: vec3(fromPos.x, fromPos.y, fromPos.z),
            vel: vec3(v0.x, v0.y, v0.z),
            prevY: fromPos.y,
          };
          const dt = 1 / 120;
          const tMax = 3.0;

          for (let t = 0; t < tMax; t += dt) {
            ball.prevY = ball.pos.y;

            // 空气阻力
            ball.vel.x *= 1 - PHYS.AIR_DRAG * dt;
            ball.vel.y *= 1 - PHYS.AIR_DRAG * dt;
            ball.vel.z *= 1 - PHYS.AIR_DRAG * dt;

            // 重力
            ball.vel.y += g * dt;

            // 积分
            ball.pos.x += ball.vel.x * dt;
            ball.pos.y += ball.vel.y * dt;
            ball.pos.z += ball.vel.z * dt;

            // 篮板碰撞
            const bz = WORLD.BACKBOARD_Z;
            const inBoardX = Math.abs(ball.pos.x - hoopX) <= WORLD.BACKBOARD_W * 0.5 + WORLD.BALL_R;
            const inBoardY = ball.pos.y >= WORLD.BACKBOARD_Y0 - WORLD.BALL_R &&
              ball.pos.y <= WORLD.BACKBOARD_Y0 + WORLD.BACKBOARD_H + WORLD.BALL_R;
            if (ball.pos.z - bz <= WORLD.BALL_R && ball.vel.z < 0 && inBoardX && inBoardY) {
              ball.pos.z = bz + WORLD.BALL_R;
              ball.vel.z = -ball.vel.z * PHYS.BOARD_REST;
            }

            // 篮筐碰撞（简化：与篮筐圆环碰撞）
            const rimY = hoopY;
            if (Math.abs(ball.pos.y - rimY) < WORLD.BALL_R + 0.03) {
              const dx = ball.pos.x - hoopX;
              const dz = ball.pos.z - hoopZ;
              const distFromCenter = Math.hypot(dx, dz);
              const rimInner = WORLD.RIM_R - 0.02;
              const rimOuter = WORLD.RIM_R + 0.02;

              // 碰到篮筐铁环
              if (distFromCenter > rimInner && distFromCenter < rimOuter + WORLD.BALL_R) {
                const normal = { x: dx / distFromCenter, z: dz / distFromCenter };
                const vDot = ball.vel.x * normal.x + ball.vel.z * normal.z;
                if (vDot < 0) {
                  ball.vel.x -= (1 + PHYS.RIM_REST) * vDot * normal.x;
                  ball.vel.z -= (1 + PHYS.RIM_REST) * vDot * normal.z;
                }
              }
            }

            // 进球判定
            if (ball.prevY > hoopY + 0.02 && ball.pos.y <= hoopY - 0.02 && ball.vel.y < 0) {
              const dx = ball.pos.x - hoopX;
              const dz = ball.pos.z - hoopZ;
              const r = Math.hypot(dx, dz);
              if (r <= getScoreRadius()) {
                return { scored: true, r };
              }
            }

            if (ball.pos.y < 0) break;
          }

          return { scored: false, r: Infinity };
        };

        // 网格搜索：尝试不同的飞行时间和高度
        let bestVel = null;
        let bestScore = Infinity;

        // 搜索参数范围
        const tMin = lerp(0.55, 0.75, dist01);
        const tMax = lerp(0.85, 1.3, dist01);
        const liftMin = 0.3;
        const liftMax = 1.2;

        for (let ti = 0; ti <= 10; ti++) {
          const T = lerp(tMin, tMax, ti / 10);

          for (let li = 0; li <= 10; li++) {
            const lift = lerp(liftMin, liftMax, li / 10);

            // 计算瞄准点（篮筐上方）
            const targetX = hoopX;
            const targetY = hoopY + lift;
            const targetZ = hoopZ;

            const dx = targetX - fromPos.x;
            const dz = targetZ - fromPos.z;
            const dy = targetY - fromPos.y;

            // 计算初速度（考虑空气阻力的补偿）
            const dragComp = 1 + PHYS.AIR_DRAG * T * 0.6;
            const vx = (dx / T) * dragComp;
            const vz = (dz / T) * dragComp;
            const vy = ((dy - 0.5 * g * T * T) / T) * dragComp;

            const v0 = vec3(vx, vy, vz);
            const result = simulateFull(v0);

            if (result.scored) {
              // 找到进球解，直接返回
              return { vel: v0, chance: 1, dist01 };
            }

            if (result.r < bestScore) {
              bestScore = result.r;
              bestVel = v0;
            }
          }
        }

        // 如果没有找到进球解，返回最接近的
        if (bestVel) {
          return { vel: bestVel, chance: 1, dist01 };
        }

        // 回退：基本抛物线
        const T = lerp(0.7, 1.0, dist01);
        const dx = hoopX - fromPos.x;
        const dz = hoopZ - fromPos.z;
        const dy = hoopY + 0.5 - fromPos.y;
        return {
          vel: vec3(dx / T, (dy - 0.5 * g * T * T) / T, dz / T),
          chance: 1,
          dist01
        };
      }

      function pointsForShot(fromPos) {
        const d = Math.hypot(fromPos.x - WORLD.HOOP.x, fromPos.z - WORLD.HOOP.z);
        return d >= WORLD.THREE_R ? 3 : 2;
      }

      function initPhysicsWorld() {
        if (!AmmoLib) return;
        const collisionConfig = new AmmoLib.btDefaultCollisionConfiguration();
        const dispatcher = new AmmoLib.btCollisionDispatcher(collisionConfig);
        const broadphase = new AmmoLib.btDbvtBroadphase();
        const solver = new AmmoLib.btSequentialImpulseConstraintSolver();
        const world = new AmmoLib.btDiscreteDynamicsWorld(dispatcher, broadphase, solver, collisionConfig);
        world.setGravity(new AmmoLib.btVector3(0, PHYS.G, 0));

        physics.world = world;
        physics.dispatcher = dispatcher;
        physics.tmpTransform = new AmmoLib.btTransform();
        physics.ballShape = new AmmoLib.btSphereShape(WORLD.BALL_R * PHYS.BALL_COLLIDER_SCALE);
        physics.ready = true;

        buildStaticBodies();
      }

      function createStaticBox(center, halfExtents, tag, opts = {}) {
        if (!physics.world) return null;
        const shape = new AmmoLib.btBoxShape(new AmmoLib.btVector3(halfExtents.x, halfExtents.y, halfExtents.z));
        const transform = new AmmoLib.btTransform();
        transform.setIdentity();
        transform.setOrigin(new AmmoLib.btVector3(center.x, center.y, center.z));
        const motionState = new AmmoLib.btDefaultMotionState(transform);
        const localInertia = new AmmoLib.btVector3(0, 0, 0);
        const rbInfo = new AmmoLib.btRigidBodyConstructionInfo(0, motionState, shape, localInertia);
        const body = new AmmoLib.btRigidBody(rbInfo);
        body.setFriction(opts.friction ?? 0.8);
        body.setRestitution(opts.restitution ?? 0.4);
        physics.world.addRigidBody(body, COLLISION.STATIC, COLLISION.BALL);
        body.userData = { type: tag };
        physics.staticBodies.push(body);
        return body;
      }

      function createRimBody() {
        if (!physics.world) return null;
        const shape = new AmmoLib.btCompoundShape();
        const tubeR = AMMO_CFG.RIM_TUBE_R;
        const segments = AMMO_CFG.RIM_SEGMENTS;
        const rimR = WORLD.RIM_R;
        for (let i = 0; i < segments; i++) {
          const a = (i / segments) * Math.PI * 2;
          const t = new AmmoLib.btTransform();
          t.setIdentity();
          t.setOrigin(new AmmoLib.btVector3(Math.cos(a) * rimR, 0, Math.sin(a) * rimR));
          shape.addChildShape(t, new AmmoLib.btSphereShape(tubeR));
        }
        const transform = new AmmoLib.btTransform();
        transform.setIdentity();
        transform.setOrigin(new AmmoLib.btVector3(WORLD.HOOP.x, WORLD.HOOP.y, WORLD.HOOP.z));
        const motionState = new AmmoLib.btDefaultMotionState(transform);
        const localInertia = new AmmoLib.btVector3(0, 0, 0);
        const rbInfo = new AmmoLib.btRigidBodyConstructionInfo(0, motionState, shape, localInertia);
        const body = new AmmoLib.btRigidBody(rbInfo);
        body.setRestitution(PHYS.RIM_REST);
        body.setFriction(PHYS.RIM_FRICTION);
        physics.world.addRigidBody(body, COLLISION.RIM, COLLISION.BALL);
        body.userData = { type: "rim" };
        physics.staticBodies.push(body);
        return body;
      }

      function buildStaticBodies() {
        const zMin = -2.0;
        const zMax = WORLD.SHOOT_Z_MAX + 1.0;
        const floorHalfZ = (zMax - zMin) * 0.5;
        const floorCenterZ = (zMax + zMin) * 0.5;
        const floorHalfY = AMMO_CFG.FLOOR_THICK * 0.5;
        const floorHalfX = WORLD.COURT_W * 0.6;

        createStaticBox(
          vec3(0, WORLD.FLOOR_Y - floorHalfY, floorCenterZ),
          vec3(floorHalfX, floorHalfY, floorHalfZ),
          "floor",
          { friction: PHYS.FLOOR_FRICTION, restitution: PHYS.FLOOR_REST },
        );

        const boardHalfX = WORLD.BACKBOARD_W * 0.5;
        const boardHalfY = WORLD.BACKBOARD_H * 0.5;
        const boardHalfZ = AMMO_CFG.BOARD_THICK * 0.5;
        createStaticBox(
          vec3(WORLD.HOOP.x, WORLD.BACKBOARD_Y0 + boardHalfY, WORLD.BACKBOARD_Z - boardHalfZ),
          vec3(boardHalfX, boardHalfY, boardHalfZ),
          "board",
          { friction: PHYS.BOARD_FRICTION, restitution: PHYS.BOARD_REST },
        );

        createRimBody();
      }

      function createBallBody(ball, pos, vel) {
        if (!physics.ready || !physics.world || !physics.ballShape) return;
        const transform = new AmmoLib.btTransform();
        transform.setIdentity();
        transform.setOrigin(new AmmoLib.btVector3(pos.x, pos.y, pos.z));
        const motionState = new AmmoLib.btDefaultMotionState(transform);
        const mass = 0.62;
        const localInertia = new AmmoLib.btVector3(0, 0, 0);
        physics.ballShape.calculateLocalInertia(mass, localInertia);
        const rbInfo = new AmmoLib.btRigidBodyConstructionInfo(mass, motionState, physics.ballShape, localInertia);
        const body = new AmmoLib.btRigidBody(rbInfo);
        body.setRestitution(PHYS.BALL_REST);
        body.setFriction(PHYS.BALL_FRICTION);
        body.setRollingFriction(0.08);
        body.setDamping(PHYS.AIR_DRAG, PHYS.ANGULAR_DAMPING);
        body.setLinearVelocity(new AmmoLib.btVector3(vel.x, vel.y, vel.z));
        body.setAngularVelocity(new AmmoLib.btVector3(0, 0, 0));
        const mask = COLLISION.STATIC | COLLISION.RIM;
        physics.world.addRigidBody(body, COLLISION.BALL, mask);
        body.userData = { type: "ball", ball };
        physics.ballBodies.add(body);
        ball.body = body;
        ball.prevY = pos.y;
        ball.age = 0;
      }

      function syncBallFromBody(ball) {
        if (!ball.body || !physics.tmpTransform) return;
        const motionState = ball.body.getMotionState();
        if (motionState) {
          motionState.getWorldTransform(physics.tmpTransform);
          const origin = physics.tmpTransform.getOrigin();
          ball.pos.x = origin.x();
          ball.pos.y = origin.y();
          ball.pos.z = origin.z();
        }
        const vel = ball.body.getLinearVelocity();
        ball.vel.x = vel.x();
        ball.vel.y = vel.y();
        ball.vel.z = vel.z();
      }

      function removeBallBody(ball) {
        if (!ball.body || !physics.world) {
          ball.body = null;
          return;
        }
        physics.world.removeRigidBody(ball.body);
        physics.ballBodies.delete(ball.body);
        ball.body = null;
      }

      function clearPhysicsBalls() {
        for (const ball of state.balls) {
          removeBallBody(ball);
        }
        physics.ballBodies.clear();
        state.balls.length = 0;
      }

      function applyAutoAimAssist(ball, dt) {
        // 自动瞄准模式不再使用辅助拉力，完全依赖真实物理
        // 此函数保留但不执行任何操作
      }

      function handleBallScore(ball) {
        if (ball.scored) return false;
        if (ball.prevY > WORLD.HOOP.y + 0.02 && ball.pos.y <= WORLD.HOOP.y - 0.02) {
          const dx = ball.pos.x - WORLD.HOOP.x;
          const dz = ball.pos.z - WORLD.HOOP.z;
          const r = Math.hypot(dx, dz);
          const scoreR = getScoreRadius();
          if (r <= scoreR) {
            ball.scored = true;
            return true;
          }
        }
        return false;
      }

      function handleBallLife(ball) {
        const v = vlen(ball.vel);
        if (ball.age > 7.0 || (ball.age > 1.2 && v < 0.6 && ball.pos.y <= WORLD.BALL_R + 0.01)) {
          ball.alive = false;
        }
      }

      function handlePhysicsContacts() {
        if (!physics.dispatcher) return;
        const dispatcher = physics.dispatcher;
        const numManifolds = dispatcher.getNumManifolds();
        const t = now();
        for (let i = 0; i < numManifolds; i++) {
          const manifold = dispatcher.getManifoldByIndexInternal(i);
          if (manifold.getNumContacts() === 0) continue;
          const body0 = AmmoLib.castObject(manifold.getBody0(), AmmoLib.btRigidBody);
          const body1 = AmmoLib.castObject(manifold.getBody1(), AmmoLib.btRigidBody);
          const ud0 = body0.userData;
          const ud1 = body1.userData;
          if (!ud0 || !ud1) continue;
          let ball = null;
          let kind = null;
          if (ud0.type === "ball" && ud1.type !== "ball") {
            ball = ud0.ball;
            kind = ud1.type;
          } else if (ud1.type === "ball" && ud0.type !== "ball") {
            ball = ud1.ball;
            kind = ud0.type;
          }
          if (!ball || ball.held || !kind) continue;
          const speed = vlen(ball.vel);
          if (speed < 1.2) continue;
          if (!ball.lastImpact) ball.lastImpact = {};
          const last = ball.lastImpact[kind] || 0;
          if (t - last < 120) continue;
          ball.lastImpact[kind] = t;
          if (kind === "board") {
            audio.board();
            spawnImpact(ball.pos, "board");
          } else if (kind === "rim") {
            audio.rim();
            spawnImpact(ball.pos, "rim");
          } else if (kind === "wall") {
            audio.rim();
            spawnImpact(ball.pos, "wall");
          } else if (kind === "floor") {
            audio.rim();
          }
        }
      }

      function stepPhysics(dt) {
        if (!physics.ready || !physics.world) return;
        for (const ball of state.balls) {
          if (!ball.body || ball.held) continue;
          syncBallFromBody(ball);
          ball.prevY = ball.pos.y;
          applyAutoAimAssist(ball, dt);
        }

        physics.world.stepSimulation(dt, AMMO_CFG.MAX_SUB_STEPS, AMMO_CFG.FIXED_STEP);

        for (const ball of state.balls) {
          if (!ball.body || ball.held) continue;
          ball.age += dt;
          syncBallFromBody(ball);
          if (handleBallScore(ball)) {
            state.match.score += ball.points;
            state.match.makes += 1;
            state.match.streak += 1;
            state.netKick = 1.0;
            audio.score();
            updateHud();
            if (state.match.score >= state.match.target) {
              endMatch(true);
              break;
            }
          }
          handleBallLife(ball);
        }

        handlePhysicsContacts();
        state.balls = state.balls.filter((b) => {
          if (b.alive) return true;
          removeBallBody(b);
          return false;
        });
      }

      // ====== Ball ======
      function makeBall(pos, vel, points) {
        return {
          id: Math.random().toString(16).slice(2),
          pos: vec3(pos.x, pos.y, pos.z),
          vel: vec3(vel.x, vel.y, vel.z),
          points,
          body: null,
          held: false,
          auto: false,
          willMake: false,
          scored: false,
          alive: true,
          age: 0,
          prevY: pos.y,
          wasAboveRim: pos.y > WORLD.HOOP.y + 0.15,
          spin: (Math.random() * 2 - 1) * 14,
          lastImpact: {},
        };
      }

      const rimPoints = (() => {
        const pts = [];
        const N = 18;
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2;
          pts.push(vec3(Math.cos(a) * WORLD.RIM_R, WORLD.HOOP.y, Math.sin(a) * WORLD.RIM_R));
        }
        return pts;
      })();

      function spawnImpact(pos, kind) {
        state.effects.push({
          pos: vec3(pos.x, pos.y, pos.z),
          age: 0,
          dur: 0.28,
          kind,
        });
      }

      function resolveSpherePoint(ball, point, pointR, restitution, tangentFriction, sfx) {
        const dx = ball.pos.x - point.x;
        const dy = ball.pos.y - point.y;
        const dz = ball.pos.z - point.z;
        const dist = Math.hypot(dx, dy, dz);
        const minDist = WORLD.BALL_R + pointR;
        if (dist <= 1e-6 || dist >= minDist) return false;
        const nx = dx / dist;
        const ny = dy / dist;
        const nz = dz / dist;

        // 推出穿透
        const pen = minDist - dist;
        ball.pos.x += nx * pen;
        ball.pos.y += ny * pen;
        ball.pos.z += nz * pen;

        // 速度反射
        const vDot = ball.vel.x * nx + ball.vel.y * ny + ball.vel.z * nz;
        if (vDot < 0) {
          ball.vel.x -= (1 + restitution) * vDot * nx;
          ball.vel.y -= (1 + restitution) * vDot * ny;
          ball.vel.z -= (1 + restitution) * vDot * nz;

          // 切向摩擦（简化）
          ball.vel.x *= tangentFriction;
          ball.vel.z *= tangentFriction;
        }

        if (sfx) sfx();
        return true;
      }

      function tickBall(ball, dt) {
        ball.age += dt;
        ball.prevY = ball.pos.y;

        // 空气阻力
        ball.vel.x *= 1 - PHYS.AIR_DRAG * dt;
        ball.vel.y *= 1 - PHYS.AIR_DRAG * dt;
        ball.vel.z *= 1 - PHYS.AIR_DRAG * dt;

        // 自动瞄准模式不再使用辅助拉力，完全依赖真实物理

        // 重力
        ball.vel.y += PHYS.G * dt;

        // 积分
        ball.pos.x += ball.vel.x * dt;
        ball.pos.y += ball.vel.y * dt;
        ball.pos.z += ball.vel.z * dt;

        // 边界墙已移除，球可以飞出场外

        // 地面
        const yMin = WORLD.BALL_R;
        if (ball.pos.y < yMin) {
          ball.pos.y = yMin;
          if (ball.vel.y < -0.5) audio.rim();
          ball.vel.y = -ball.vel.y * PHYS.FLOOR_REST;
          ball.vel.x *= PHYS.FLOOR_FRICTION;
          ball.vel.z *= PHYS.FLOOR_FRICTION;
          if (Math.abs(ball.vel.y) < 0.55) ball.vel.y = 0;
        }

        // 篮板（平面 z = BACKBOARD_Z）
        const bz = WORLD.BACKBOARD_Z;
        const inBoardX = Math.abs(ball.pos.x - WORLD.HOOP.x) <= WORLD.BACKBOARD_W * 0.5 + WORLD.BALL_R;
        const inBoardY = ball.pos.y >= WORLD.BACKBOARD_Y0 - WORLD.BALL_R &&
          ball.pos.y <= WORLD.BACKBOARD_Y0 + WORLD.BACKBOARD_H + WORLD.BALL_R;
        const crossedBoard = ball.pos.z - bz <= WORLD.BALL_R && (ball.pos.z - ball.vel.z * dt) - bz > WORLD.BALL_R;
        if (crossedBoard && inBoardX && inBoardY) {
          ball.pos.z = bz + WORLD.BALL_R;
          ball.vel.z = -ball.vel.z * PHYS.BOARD_REST;
          ball.vel.x *= 0.97;
          audio.board();
          spawnImpact(ball.pos, "board");
        }

        // 篮筐（离散点近似）
        let rimHit = false;
        for (const p of rimPoints) {
          if (resolveSpherePoint(ball, p, 0.03, PHYS.RIM_REST, PHYS.TANGENT_FRICTION, audio.rim)) {
            rimHit = true;
          }
        }
        if (rimHit) {
          spawnImpact(ball.pos, "rim");
        }

        // 进球判定：从上穿过篮筐平面并落下
        const y0 = ball.prevY;
        const y1 = ball.pos.y;
        if (!ball.scored && y0 > WORLD.HOOP.y + 0.02 && y1 <= WORLD.HOOP.y - 0.02) {
          const dx = ball.pos.x - WORLD.HOOP.x;
          const dz = ball.pos.z - WORLD.HOOP.z;
          const r = Math.hypot(dx, dz);
          const scoreR = getScoreRadius();
          if (r <= scoreR) {
            ball.scored = true;
            return "score";
          }
        }

        // 生命期：太久或速度太低就回收
        const v = vlen(ball.vel);
        if (ball.age > 7.0 || (ball.age > 1.2 && v < 0.6 && ball.pos.y <= WORLD.BALL_R + 0.01)) {
          ball.alive = false;
        }

        return null;
      }

      // ====== 渲染（欧美卡通风格：高饱和 + 粗描边） ======
      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, "rgba(255,255,255,0.10)");
        g.addColorStop(1, "rgba(0,0,0,0.22)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 漫画光斑
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = "white";
        for (let i = 0; i < 6; i++) {
          const x = (0.12 + i * 0.16) * canvas.width;
          const y = (0.10 + (i % 2) * 0.07) * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, canvas.width * 0.05, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawCourt() {
        const y = 0;
        const hw = WORLD.COURT_W * 0.5;
        const L = WORLD.SHOOT_Z_MAX; // 地板延伸到出手区，避免视觉上“球在场外漂移”
        const corners = [
          vec3(-hw, y, L),
          vec3(hw, y, L),
          vec3(hw, y, -1.4),
          vec3(-hw, y, -1.4),
        ].map(project);
        if (corners.some((p) => !p)) return;

        // 地板
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < corners.length; i++) ctx.lineTo(corners[i].x, corners[i].y);
        ctx.closePath();
        ctx.fillStyle = "rgba(255,255,255,0.10)";
        ctx.fill();
        ctx.lineWidth = Math.max(2, canvas.width * 0.0022);
        ctx.strokeStyle = "rgba(0,0,0,0.30)";
        ctx.stroke();

        // 木地板条纹（简化）
        ctx.globalAlpha = 0.10;
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = Math.max(1, canvas.width * 0.0012);
        const stripes = 9;
        for (let i = 1; i < stripes; i++) {
          const x = lerp(-hw, hw, i / stripes);
          const p0 = project(vec3(x, 0, L));
          const p1 = project(vec3(x, 0, -1.4));
          if (!p0 || !p1) continue;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.restore();

        // 三分线（半圆弧 + 直线）
        ctx.save();
        ctx.lineWidth = Math.max(2, canvas.width * 0.0022);
        ctx.strokeStyle = "rgba(255,255,255,0.65)";
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 10;
        ctx.beginPath();

        const arcPts = [];
        const N = 40;
        const r = WORLD.THREE_R;
        // 只画半场里可见的一段弧线
        for (let i = 0; i <= N; i++) {
          const a = lerp(-Math.PI * 0.92, Math.PI * 0.92, i / N);
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (z < -0.2) continue;
          arcPts.push(vec3(x, 0.01, z));
        }
        for (let i = 0; i < arcPts.length; i++) {
          const p = project(arcPts[i]);
          if (!p) continue;
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawBackboardAndHoop() {
        // 篮板
        const x0 = -WORLD.BACKBOARD_W * 0.5;
        const x1 = WORLD.BACKBOARD_W * 0.5;
        const y0 = WORLD.BACKBOARD_Y0;
        const y1 = WORLD.BACKBOARD_Y0 + WORLD.BACKBOARD_H;
        const z = WORLD.BACKBOARD_Z;
        const quad = [vec3(x0, y0, z), vec3(x1, y0, z), vec3(x1, y1, z), vec3(x0, y1, z)].map(project);
        if (!quad.some((p) => !p)) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(quad[0].x, quad[0].y);
          for (let i = 1; i < quad.length; i++) ctx.lineTo(quad[i].x, quad[i].y);
          ctx.closePath();
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.fill();
          ctx.lineWidth = Math.max(2, canvas.width * 0.0022);
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.stroke();

          // 小方框
          const boxW = 0.6;
          const boxH = 0.45;
          const bq = [
            vec3(-boxW * 0.5, WORLD.HOOP.y + 0.18 - boxH * 0.5, z + 0.001),
            vec3(boxW * 0.5, WORLD.HOOP.y + 0.18 - boxH * 0.5, z + 0.001),
            vec3(boxW * 0.5, WORLD.HOOP.y + 0.18 + boxH * 0.5, z + 0.001),
            vec3(-boxW * 0.5, WORLD.HOOP.y + 0.18 + boxH * 0.5, z + 0.001),
          ].map(project);
          if (!bq.some((p) => !p)) {
            ctx.beginPath();
            ctx.moveTo(bq[0].x, bq[0].y);
            for (let i = 1; i < bq.length; i++) ctx.lineTo(bq[i].x, bq[i].y);
            ctx.closePath();
            ctx.lineWidth = Math.max(2, canvas.width * 0.0018);
            ctx.strokeStyle = "rgba(255, 64, 64, 0.9)";
            ctx.stroke();
          }
          ctx.restore();
        }

        // 篮筐（画环）
        ctx.save();
        ctx.lineWidth = Math.max(3, canvas.width * 0.0030);
        ctx.strokeStyle = "rgba(255, 80, 70, 0.95)";
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        const N = 42;
        for (let i = 0; i <= N; i++) {
          const a = (i / N) * Math.PI * 2;
          const p = project(vec3(Math.cos(a) * WORLD.RIM_R, WORLD.HOOP.y, Math.sin(a) * WORLD.RIM_R));
          if (!p) continue;
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // 网（漫画感：几条线）
        // 更真实的网兜：上下两圈 + 纵线 + 斜向交织，并在进球时轻微摆动
        const kick = state.netKick;
        const phase = state.netPhase;
        const topR = WORLD.RIM_R * 0.94;
        const botR = WORLD.RIM_R * 0.38;
        const netDepth = 0.62;
        const seg = 16;

        const topRing = [];
        const botRing = [];
        for (let i = 0; i <= seg; i++) {
          const a = (i / seg) * Math.PI * 2;
          topRing.push(vec3(Math.cos(a) * topR, WORLD.HOOP.y, Math.sin(a) * topR));
          const sway = kick * 0.06 * Math.sin(a * 2 + phase);
          botRing.push(vec3(Math.cos(a) * botR, WORLD.HOOP.y - netDepth + sway, Math.sin(a) * botR));
        }

        ctx.save();
        ctx.globalAlpha = 0.62;
        ctx.lineWidth = Math.max(1.1, canvas.width * 0.00115);
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.shadowColor = "rgba(0,0,0,0.15)";
        ctx.shadowBlur = 8;

        const strokeRing = (ring) => {
          ctx.beginPath();
          for (let i = 0; i < ring.length; i++) {
            const p = project(ring[i]);
            if (!p) continue;
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        };

        // 圈
        ctx.globalAlpha = 0.45;
        strokeRing(topRing);
        ctx.globalAlpha = 0.35;
        strokeRing(botRing);

        // 纵线 + 斜线（交织）
        ctx.globalAlpha = 0.55;
        const strands = 12;
        for (let i = 0; i < strands; i++) {
          const a = (i / strands) * Math.PI * 2;
          const a2 = a + (Math.PI * 2) / (strands * 2);
          const top = vec3(Math.cos(a) * topR, WORLD.HOOP.y, Math.sin(a) * topR);
          const bot = vec3(Math.cos(a) * botR, WORLD.HOOP.y - netDepth + kick * 0.06 * Math.sin(a * 2 + phase), Math.sin(a) * botR);
          const bot2 = vec3(Math.cos(a2) * botR, WORLD.HOOP.y - netDepth + kick * 0.06 * Math.sin(a2 * 2 + phase), Math.sin(a2) * botR);

          const pTop = project(top);
          const pBot = project(bot);
          const pBot2 = project(bot2);
          if (pTop && pBot) {
            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pBot.x, pBot.y);
            ctx.stroke();
          }
          // 斜向交织
          if (pTop && pBot2) {
            ctx.globalAlpha = 0.28;
            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pBot2.x, pBot2.y);
            ctx.stroke();
            ctx.globalAlpha = 0.55;
          }
        }
        ctx.restore();
        ctx.restore();
      }

      function drawBall(ball) {
        const p = project(ball.pos);
        if (!p) return;
        const r = Math.max(2, pxRadius(WORLD.BALL_R, p.z));

        // 阴影（落在地面）
        const shadowP = project(vec3(ball.pos.x, WORLD.BALL_R, ball.pos.z));
        if (shadowP) {
          const h = clamp((ball.pos.y - WORLD.BALL_R) / 5.0, 0, 1);
          const sr = r * lerp(1.25, 0.65, h);
          ctx.save();
          ctx.globalAlpha = lerp(0.22, 0.06, h);
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.beginPath();
          ctx.ellipse(shadowP.x, shadowP.y + r * 0.25, sr, sr * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 球体
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 140, 60, 1)";
        ctx.fill();
        ctx.lineWidth = Math.max(2, r * 0.18);
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.stroke();

        // 高光
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(p.x - r * 0.28, p.y - r * 0.30, r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // 篮球纹路（简化：两条弧 + 一条竖线）
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = Math.max(1.3, r * 0.10);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.92, -Math.PI * 0.25, Math.PI * 0.25);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.92, Math.PI * 0.75, Math.PI * 1.25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - r);
        ctx.lineTo(p.x, p.y + r);
        ctx.stroke();

        // 命中提示
        if (ball.scored) {
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = "rgba(53, 208, 127, 0.95)";
          ctx.font = `900 ${Math.max(14, r * 1.2)}px ui-sans-serif, system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`+${ball.points}`, p.x, p.y - r * 1.9);
        }
        ctx.restore();
      }

      function drawEffects() {
        if (!state.effects.length) return;
        const colors = {
          wall: "rgba(120, 200, 255, 1)",
          rim: "rgba(255, 200, 120, 1)",
          board: "rgba(255, 255, 255, 1)",
        };
        for (const fx of state.effects) {
          const p = project(fx.pos);
          if (!p) continue;
          const t = clamp(fx.age / fx.dur, 0, 1);
          const alpha = 1 - t;
          const r = Math.max(6, canvas.width * 0.01) * lerp(0.6, 1.8, t);
          ctx.save();
          ctx.globalAlpha = alpha * 0.9;
          ctx.strokeStyle = colors[fx.kind] || "rgba(255,255,255,1)";
          ctx.lineWidth = Math.max(2, canvas.width * 0.002);
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawAim() {
        if (!state.aim.active) return;
        const sx = state.aim.sx;
        const sy = state.aim.sy;
        const cx = state.aim.cx;
        const cy = state.aim.cy;

        const moved = state.aim.moved;
        const dpr = projectionMap.dpr || 1;
        const psx = sx * dpr;
        const psy = sy * dpr;
        ctx.save();
        ctx.lineWidth = Math.max(2, canvas.width * 0.0025);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillStyle = "rgba(255, 204, 0, 0.25)";
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 10;
        const r = Math.max(10, canvas.width * 0.012);
        ctx.beginPath();
        ctx.arc(psx, psy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (moved < 6) return;

        // 用“真实投篮方向”画辅助线，避免手势方向与实际轨迹不一致
        const dtMs = now() - state.aim.st;
        const from = state.aim.startWorld || (screenToCourtWorld(sx, sy, WORLD.BALL_R, false) || screenToCourt(sx, sy));
        const vel = swipeToVelocity(sx, sy, cx, cy, dtMs, from, true);
        const dir = vnorm(vec3(vel.x, 0, vel.z));
        const len = clamp(Math.hypot(vel.x, vel.z) * 0.18, 1.2, 3.5);

        const drawFrom = getAimOrigin(from);
        const p0 = project(vec3(drawFrom.x, drawFrom.y, drawFrom.z));
        const p1 = project(vec3(drawFrom.x + dir.x * len, drawFrom.y, drawFrom.z + dir.z * len));
        if (!p0 || !p1) return;

        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const L = Math.hypot(dx, dy);
        if (L < 6) return;

        ctx.save();
        ctx.lineWidth = Math.max(3, canvas.width * 0.0032);
        ctx.strokeStyle = "rgba(255, 204, 0, 0.9)";
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        // 箭头
        const ux = dx / L;
        const uy = dy / L;
        const ax = p1.x;
        const ay = p1.y;
        const head = Math.max(16, canvas.width * 0.02);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - ux * head - uy * head * 0.55, ay - uy * head + ux * head * 0.55);
        ctx.lineTo(ax - ux * head + uy * head * 0.55, ay - uy * head - ux * head * 0.55);
        ctx.closePath();
        ctx.fillStyle = "rgba(255, 204, 0, 0.95)";
        ctx.fill();
        ctx.restore();
      }

      function drawScoreBanner() {
        if (state.mode !== "match") return;
        // 只在接近结束时提示
        if (state.match.timeLeft > 6.0) return;
        const need = Math.max(0, state.match.target - state.match.score);
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(0, 0, canvas.width, Math.max(46, canvas.height * 0.09));
        ctx.fillStyle = "white";
        ctx.font = `900 ${Math.max(18, canvas.width * 0.022)}px ui-sans-serif, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(need <= 0 ? "达标！稳住！" : `还差 ${need} 分！`, canvas.width / 2, Math.max(24, canvas.height * 0.045));
        ctx.restore();
      }

      function drawTrajectoryPreview() {
        if (!state.aim.active) return;
        if (!state.aim.previewBall) return;
        if (state.mode !== "match" || !state.match.running) return;
        // 轻点（自动瞄准）不画预览
        if (state.aim.moved <= INPUT.TAP_MAX_PX) return;

        const dtMs = now() - state.aim.st;
        const from = state.aim.startWorld || state.aim.previewBall.pos;
        const drawFrom = getAimOrigin(from);
        const vel = swipeToVelocity(state.aim.sx, state.aim.sy, state.aim.cx, state.aim.cy, dtMs, from, true);

        // 预测弹道：使用与 Ammo 物理一致的阻尼与重力做数值积分
        const tMax = 1.4;
        const steps = 20;
        const dt = tMax / steps;
        const pts = [];
        let pos = vec3(drawFrom.x, drawFrom.y, drawFrom.z);
        let v = vec3(vel.x, vel.y, vel.z);
        pts.push(vec3(pos.x, pos.y, pos.z));
        for (let i = 0; i < steps; i++) {
          v.x *= 1 - PHYS.AIR_DRAG * dt;
          v.y *= 1 - PHYS.AIR_DRAG * dt;
          v.z *= 1 - PHYS.AIR_DRAG * dt;
          v.y += PHYS.G * dt;
          pos = vadd(pos, vmul(v, dt));
          if (pos.y < WORLD.BALL_R) break;
          pts.push(vec3(pos.x, pos.y, pos.z));
        }
        if (pts.length < 2) return;

        ctx.save();
        // 先画柔和光晕
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = Math.max(5, canvas.width * 0.004);
        ctx.strokeStyle = "rgba(255, 204, 0, 0.55)";
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        let started = false;
        for (const w of pts) {
          const p = project(w);
          if (!p) continue;
          if (!started) {
            ctx.moveTo(p.x, p.y);
            started = true;
          } else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // 画虚线主轨迹
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = Math.max(2, canvas.width * 0.0022);
        ctx.setLineDash([Math.max(6, canvas.width * 0.012), Math.max(6, canvas.width * 0.010)]);
        ctx.strokeStyle = "rgba(255, 240, 190, 0.95)";
        ctx.beginPath();
        started = false;
        for (const w of pts) {
          const p = project(w);
          if (!p) continue;
          if (!started) {
            ctx.moveTo(p.x, p.y);
            started = true;
          } else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // 终点提示点
        const last = pts[pts.length - 1];
        const pl = project(last);
        if (pl) {
          const r = Math.max(4, canvas.width * 0.007);
          ctx.fillStyle = "rgba(255, 204, 0, 0.95)";
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.lineWidth = Math.max(2, canvas.width * 0.002);
          ctx.beginPath();
          ctx.arc(pl.x, pl.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }

      // ====== 主循环 ======
      function tick(ts) {
        if (!state.lastTs) state.lastTs = ts;
        const dt = clamp((ts - state.lastTs) / 1000, 0.0, 0.033);
        state.lastTs = ts;

        state.netPhase += dt * 6.0;
        state.netKick *= Math.exp(-dt * 5.0);

        if (state.mode === "match" && state.match.running) {
          state.match.timeLeft -= dt;
          if (state.match.timeLeft <= 0) {
            state.match.timeLeft = 0;
            updateHud();
            endMatch(state.match.score >= state.match.target);
          }
        }

        // 物理更新（match 时才更新；story 时冻结画面）
        if (state.mode === "match" && state.match.running) {
          if (physics.ready) {
            stepPhysics(dt);
          } else {
            for (const ball of state.balls) {
              if (ball.held) continue;
              const evt = tickBall(ball, dt);
              if (evt === "score") {
                state.match.score += ball.points;
                state.match.makes += 1;
                state.match.streak += 1;
                state.netKick = 1.0;
                audio.score();
                updateHud();
                if (state.match.score >= state.match.target) {
                  // 提前胜利：立即触发结算
                  endMatch(true);
                  break;
                }
              }
            }
            state.balls = state.balls.filter((b) => b.alive);
          }
        }

        if (state.effects.length) {
          for (const fx of state.effects) fx.age += dt;
          state.effects = state.effects.filter((fx) => fx.age < fx.dur);
        }

        render();
        requestAnimationFrame(tick);
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        drawCourt();
        drawBackboardAndHoop();
        drawTrajectoryPreview();

        // 按深度排序（zCam 大 = 更远，应该先画；近的后画）
        const drawList = state.balls
          .map((b) => {
            const p = project(b.pos);
            return p ? { b, z: p.z } : null;
          })
          .filter(Boolean)
          .sort((a, b) => b.z - a.z);

        for (const item of drawList) drawBall(item.b);

        drawEffects();
        drawAim();
        drawScoreBanner();
      }

      // ====== 交互 ======
      function canShoot() {
        return state.mode === "match" && state.match.running;
      }

      function getClientPointFromEvent(e) {
        // 统一 pointer/touch/mouse 坐标，返回 client 坐标（CSS px）
        if (e.touches && e.touches.length) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        if (e.changedTouches && e.changedTouches.length) {
          return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function getLocalPointFromClient(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        return {
          x: clamp(x, 0, rect.width),
          y: clamp(y, 0, rect.height),
        };
      }

      function getLocalPoint(e) {
        const p = getClientPointFromEvent(e);
        return getLocalPointFromClient(p.x, p.y);
      }

      function onPointerDown(e) {
        if (!canShoot()) return;
        if (state.aim.active) return;
        const p = getLocalPoint(e);
        const startWorld = screenToCourtWorld(p.x, p.y, WORLD.BALL_R, false) || screenToCourt(p.x, p.y);
        state.aim.active = true;
        state.aim.pointerId = e.pointerId;
        state.aim.sx = p.x;
        state.aim.sy = p.y;
        state.aim.cx = p.x;
        state.aim.cy = p.y;
        state.aim.st = now();
        state.aim.startWorld = startWorld;
        state.aim.moved = 0;
        state.aim.longPressed = false;
        state.aim.forceManual = false;
        if (state.aim.longPressTimer) {
          clearTimeout(state.aim.longPressTimer);
          state.aim.longPressTimer = null;
        }

        try {
          canvasWrap.setPointerCapture(e.pointerId);
        } catch { }

        const preview = makeBall(startWorld, vec3(0, 0, 0), pointsForShot(startWorld));
        preview.held = true;
        preview.alive = true;
        preview.scored = false;
        state.aim.previewBall = preview;
        // 起点生成篮球：立即加入渲染列表，但 release 前不运动
        state.balls.push(preview);
        audio.swish();
      }

      function onPointerMove(e) {
        if (!state.aim.active) return;
        if (e.pointerId !== state.aim.pointerId) return;
        const p = getLocalPoint(e);
        state.aim.cx = p.x;
        state.aim.cy = p.y;
        state.aim.moved = Math.max(state.aim.moved, Math.hypot(state.aim.cx - state.aim.sx, state.aim.cy - state.aim.sy));
        if (state.aim.moved > INPUT.LONGPRESS_MAX_PX && state.aim.longPressTimer) {
          clearTimeout(state.aim.longPressTimer);
          state.aim.longPressTimer = null;
        }
      }

      function onPointerUp(e) {
        if (!state.aim.active) return;
        if (e.pointerId !== state.aim.pointerId) return;
        const p = getLocalPoint(e);
        if (state.aim.longPressTimer) {
          clearTimeout(state.aim.longPressTimer);
          state.aim.longPressTimer = null;
        }

        const t1 = now();
        const dtMs = t1 - state.aim.st;
        const sx = state.aim.sx;
        const sy = state.aim.sy;
        const ex = p.x;
        const ey = p.y;

        const preview = state.aim.previewBall;
        if (preview) {
          // 起点严格使用 pointerdown 时的世界坐标（避免多次映射造成偏差）
          const pos = state.aim.startWorld || (screenToCourtWorld(sx, sy, WORLD.BALL_R, false) || screenToCourt(sx, sy));
          preview.pos.x = pos.x;
          preview.pos.y = pos.y;
          preview.pos.z = pos.z;

          preview.held = false;
          const isTap = dtMs <= INPUT.TAP_MAX_MS && state.aim.moved <= INPUT.TAP_MAX_PX && !state.aim.forceManual;
          if (isTap) {
            const { vel, chance, dist01 } = autoAimVelocityAndChance(pos);
            preview.auto = true;
            preview.willMake = Math.random() < chance;
            // 未命中：加大水平偏差，让“远投更难”
            if (!preview.willMake) {
              const missAngle = lerp(0.10, 0.35, dist01) * (Math.random() < 0.5 ? -1 : 1);
              const c = Math.cos(missAngle);
              const s = Math.sin(missAngle);
              const vx = vel.x * c - vel.z * s;
              const vz = vel.x * s + vel.z * c;
              preview.vel.x = vx;
              preview.vel.y = vel.y * lerp(0.98, 0.92, dist01);
              preview.vel.z = vz;
            } else {
              preview.vel.x = vel.x;
              preview.vel.y = vel.y;
              preview.vel.z = vel.z;
            }
          } else {
            const vel = swipeToVelocity(sx, sy, ex, ey, dtMs, pos);
            preview.auto = false;
            preview.willMake = false;
            preview.vel.x = vel.x;
            preview.vel.y = vel.y;
            preview.vel.z = vel.z;
          }
          preview.points = pointsForShot(pos);
          preview.age = 0;
          preview.prevY = preview.pos.y;
          preview.scored = false;
          if (physics.ready) {
            createBallBody(preview, preview.pos, preview.vel);
          }

          state.match.shots += 1;
        }

        state.aim.active = false;
        state.aim.pointerId = null;
        state.aim.previewBall = null;
        state.aim.startWorld = null;
        state.aim.moved = 0;
        state.aim.longPressed = false;
        state.aim.forceManual = false;
        if (state.firstPerson.active) {
          exitFirstPerson();
        }
        try {
          canvasWrap.releasePointerCapture(e.pointerId);
        } catch { }
        updateHud();
      }

      const canvasWrap = document.getElementById("canvasWrap");
      canvasWrap.addEventListener("pointerdown", onPointerDown, { passive: true });
      canvasWrap.addEventListener("pointermove", onPointerMove, { passive: true });
      canvasWrap.addEventListener("pointerup", onPointerUp, { passive: true });
      canvasWrap.addEventListener("pointercancel", onPointerUp, { passive: true });

      // 兼容性兜底：部分设备 pointer 事件不稳定时，用 touch 事件补一层
      // 注意：只在没有 PointerEvent 的环境启用，避免重复触发。
      if (!window.PointerEvent) {
        let touchActive = false;
        const touchId = { v: null };

        const touchDown = (e) => {
          if (!canShoot()) return;
          if (touchActive) return;
          touchActive = true;
          touchId.v = 1;
          onPointerDown({ ...e, pointerId: 1, clientX: getClientPointFromEvent(e).x, clientY: getClientPointFromEvent(e).y });
        };
        const touchMove = (e) => {
          if (!touchActive) return;
          onPointerMove({ ...e, pointerId: 1, clientX: getClientPointFromEvent(e).x, clientY: getClientPointFromEvent(e).y });
        };
        const touchUp = (e) => {
          if (!touchActive) return;
          touchActive = false;
          onPointerUp({ ...e, pointerId: 1, clientX: getClientPointFromEvent(e).x, clientY: getClientPointFromEvent(e).y });
        };

        canvasWrap.addEventListener("touchstart", touchDown, { passive: true });
        canvasWrap.addEventListener("touchmove", touchMove, { passive: true });
        canvasWrap.addEventListener("touchend", touchUp, { passive: true });
        canvasWrap.addEventListener("touchcancel", touchUp, { passive: true });
      }

      // ====== 按钮 ======
      el.btnStart.addEventListener("click", () => {
        // 首次：先看剧情序章
        if (state.mode === "boot") {
          state.chapterIndex = 0;
          openStory(CAMPAIGN[0].pre);
          return;
        }
        // match/result 下：开始/继续
        if (state.mode === "story") return;
        openStory(CAMPAIGN[state.chapterIndex].pre);
      });

      el.btnRestart.addEventListener("click", () => {
        if (state.mode === "story") return;
        startMatch();
      });

      el.btnStory.addEventListener("click", () => {
        const ch = CAMPAIGN[state.chapterIndex];
        openStory(ch.pre);
      });

      el.btnNext.addEventListener("click", () => {
        const total = state.storyQueue.length || 1;
        const idx = state.storyPos;
        if (idx >= total - 1) {
          // 结束对话
          showOverlay(false);
          const after = state._afterStory;
          state._afterStory = null;
          if (after === "advance") {
            toNextChapterOrFreeplay();
            return;
          }
          if (after === "retry") {
            startMatch();
            return;
          }
          // 普通预剧情：开始比赛
          startMatch();
          return;
        }
        state.storyPos += 1;
        renderStoryStep();
      });

      el.btnSkip.addEventListener("click", () => {
        // 跳到最后一句
        state.storyPos = Math.max(0, (state.storyQueue.length || 1) - 1);
        renderStoryStep();
      });

      // ====== 启动 ======
      function boot() {
        state.mode = "boot";
        resetMatch();
        updateHud();
        // 默认打开序章
        openStory(CAMPAIGN[0].pre);
      }

      function startGame() {
        boot();
        requestAnimationFrame(tick);
      }

      function initAmmoAndStart() {
        if (typeof Ammo === "function") {
          Ammo().then((lib) => {
            AmmoLib = lib;
            initPhysicsWorld();
            startGame();
          }).catch(() => {
            console.warn("Ammo 初始化失败，回退为简化物理");
            startGame();
          });
          return;
        }
        if (window.Ammo && window.Ammo.btVector3) {
          AmmoLib = window.Ammo;
          initPhysicsWorld();
        }
        startGame();
      }

      initAmmoAndStart();
    })();
  </script>
</body>

</html>
