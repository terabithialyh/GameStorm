<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rookie Rise - 菜鸟崛起</title>
  <style>
    :root {
      --ink: #101018;
      --paper: #ffffff;
      --bg1: #2f6bff;
      --bg2: #7b2cff;
      --accent: #ffcc00;
      --good: #35d07f;
      --bad: #ff5a6a;
      --panel: rgba(255, 255, 255, 0.92);
      --panel2: rgba(255, 255, 255, 0.15);
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(1200px 800px at 30% 20%, rgba(255, 255, 255, 0.25), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: white;
      user-select: none;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    #gameWrap {
      position: relative;
      width: min(980px, 100vw);
      height: 100vh;
      max-height: 100vh;
      padding: 14px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      height: 64px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    .brand .sub {
      font-size: 12px;
      opacity: 0.9;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      overflow-x: auto;
      flex-shrink: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill b {
      font-size: 14px;
    }

    .pill.good b {
      color: var(--good);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }

    .pill.bad b {
      color: var(--bad);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }

    .btnRow {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    button {
      appearance: none;
      border: none;
      touch-action: manipulation;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06));
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    button.primary {
      background: linear-gradient(180deg, #ffd74b, #ffb300);
      color: #1c1600;
      border-color: rgba(0, 0, 0, 0.12);
    }

    button.danger {
      background: linear-gradient(180deg, #ff5a6a, #ff2f4c);
      color: white;
      border-color: rgba(0, 0, 0, 0.12);
    }

    #canvasWrap {
      position: relative;
      flex: 1;
      z-index: 1;
      touch-action: none;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hint {
      position: absolute;
      left: 14px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      font-size: 12px;
      max-width: min(520px, calc(100% - 28px));
      line-height: 1.35;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.58);
    }

    #overlay.show {
      display: flex;
    }

    .panel {
      width: min(680px, 100%);
      border-radius: 18px;
      background: var(--panel);
      color: var(--ink);
      border: 3px solid rgba(0, 0, 0, 0.15);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .panelHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 10px;
      background: linear-gradient(180deg, rgba(255, 204, 0, 0.55), rgba(255, 204, 0, 0.15));
      border-bottom: 2px solid rgba(0, 0, 0, 0.12);
    }

    .panelHead .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .panelHead .title b {
      font-size: 16px;
    }

    .panelHead .title span {
      font-size: 12px;
      opacity: 0.8;
    }

    .panelBody {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .speaker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.12);
      font-size: 12px;
      font-weight: 800;
    }

    .dialogText {
      font-size: 14px;
      line-height: 1.5;
      padding: 12px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.04);
      border: 2px solid rgba(0, 0, 0, 0.08);
    }

    .metaRow {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metaCard {
      border-radius: 14px;
      padding: 10px 10px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metaCard .k {
      font-size: 11px;
      opacity: 0.75;
      font-weight: 800;
    }

    .metaCard .v {
      font-size: 14px;
      font-weight: 900;
    }

    .panelActions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 14px;
      border-top: 2px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.85);
    }

    .panelActions .left,
    .panelActions .right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 540px) {
      header {
        flex-direction: row;
        align-items: center;
        min-height: 50px;
        padding: 8px 10px;
        gap: 8px;
      }

      .brand h1 {
        font-size: 14px;
      }

      .brand .sub {
        display: none;
      }

      .hud {
        justify-content: flex-end;
        gap: 6px;
      }

      .pill {
        padding: 4px 8px;
        font-size: 11px;
        gap: 4px;
      }

      .metaRow {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="gameWrap">
      <header>
        <div class="brand">
          <h1>🏀 Rookie Rise</h1>
          <div class="sub">从选秀菜鸟到球队领袖 · 半场投篮挑战（滑动投篮）</div>
        </div>
        <div class="hud">
          <div class="pill"><span>比赛</span><b id="hudMatch">-</b></div>
          <div class="pill"><span>分数</span><b id="hudScore">0</b></div>
          <div class="pill"><span>目标</span><b id="hudTarget">0</b></div>
          <div class="pill"><span>时间</span><b id="hudTime">0.0</b></div>
          <div class="pill"><span>能力</span><b id="hudRating">60</b></div>
        </div>
        <div class="btnRow">
          <button id="btnStory">剧情</button>
          <button id="btnRestart" class="danger">重开本场</button>
          <button id="btnStart" class="primary">开始</button>
        </div>
      </header>

      <div id="canvasWrap">
        <canvas id="c"></canvas>
        <div id="hint">
          操作：<b>快速点击</b>自动瞄准投篮（距离越远命中率越低）；<b>按住拖动再松手</b>手势投篮（左右方向=水平偏移，弧度力量=向上拖动）。<br />
          计分：三分线内 2 分，三分线外 3 分。限时达成目标即可触发新剧情并进入下一场。
        </div>

        <div id="overlay">
          <div class="panel">
            <div class="panelHead">
              <div class="title">
                <b id="ovTitle">剧情</b>
                <span id="ovSub">——</span>
              </div>
              <div class="badge" id="ovStep">1/1</div>
            </div>
            <div class="panelBody">
              <div class="speaker">
                <span id="ovAvatar">🧢</span>
                <span id="ovSpeaker">旁白</span>
                <span class="badge" id="ovTag">序章</span>
              </div>
              <div class="dialogText" id="ovText"></div>
              <div class="metaRow" id="ovMetaRow">
                <div class="metaCard">
                  <div class="k">对手</div>
                  <div class="v" id="ovOpponent">—</div>
                </div>
                <div class="metaCard">
                  <div class="k">目标</div>
                  <div class="v" id="ovMetaTarget">—</div>
                </div>
                <div class="metaCard">
                  <div class="k">时间</div>
                  <div class="v" id="ovMetaTime">—</div>
                </div>
              </div>
            </div>
            <div class="panelActions">
              <div class="left">
                <button id="btnSkip">跳过</button>
              </div>
              <div class="right">
                <button id="btnNext" class="primary">下一句</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ammo.js@0.0.10/builds/ammo.wasm.js"></script>
  <script>
    (() => {
      "use strict";

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const now = () => performance.now();

      const vec3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
      const vadd = (a, b) => vec3(a.x + b.x, a.y + b.y, a.z + b.z);
      const vsub = (a, b) => vec3(a.x - b.x, a.y - b.y, a.z - b.z);
      const vmul = (a, s) => vec3(a.x * s, a.y * s, a.z * s);
      const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
      const vlen = (a) => Math.hypot(a.x, a.y, a.z);
      const vnorm = (a) => {
        const L = vlen(a);
        if (L < 1e-9) return vec3(0, 0, 0);
        return vmul(a, 1 / L);
      };
      const vcross = (a, b) =>
        vec3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);

      const audio = (() => {
        let ctx = null;
        const ensure = () => {
          if (ctx) return ctx;
          try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
          } catch {
            ctx = null;
          }
          return ctx;
        };
        const beep = (type, freq, dur, gain) => {
          const ac = ensure();
          if (!ac) return;
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          g.gain.value = 0.0001;
          osc.connect(g);
          g.connect(ac.destination);
          osc.start(t0);
          g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.stop(t0 + dur + 0.02);
        };
        return {
          swish: () => beep("sine", 520, 0.09, 0.12),
          rim: () => beep("triangle", 240, 0.12, 0.14),
          board: () => beep("square", 160, 0.08, 0.08),
          score: () => beep("sine", 820, 0.14, 0.16),
          buzz: () => beep("sawtooth", 120, 0.25, 0.08),
        };
      })();

      // ====== 世界与物理配置 ======
      const WORLD = Object.freeze({
        COURT_W: 15.0,
        COURT_L: 14.0,
        SHOOT_Z_MAX: 16.8, // 允许在底线外一点出手，避免触摸靠下时被 clamp 导致“起点漂移”
        FLOOR_Y: 0.0,
        HOOP: vec3(0, 3.05, 0.0),
        BACKBOARD_Z: -0.65,
        BACKBOARD_W: 1.8,
        BACKBOARD_H: 1.2,
        BACKBOARD_Y0: 2.65,
        RIM_R: 0.31,
        BALL_R: 0.12,
        THREE_R: 7.24,
      });

      const PHYS = Object.freeze({
        G: -14.0, // 稍微夸张一些，让手感更“游戏化”，但仍像真实抛物线
        AIR_DRAG: 0.03,
        ANGULAR_DAMPING: 0.6,
        BALL_REST: 0.72,
        BALL_FRICTION: 0.6,
        BALL_COLLIDER_SCALE: 0.85,
        FLOOR_REST: 0.55,
        RIM_REST: 0.62,
        BOARD_REST: 0.68,
        WALL_REST: 0.45,
        FLOOR_FRICTION: 0.9,
        RIM_FRICTION: 0.45,
        BOARD_FRICTION: 0.55,
        WALL_FRICTION: 0.5,
        TANGENT_FRICTION: 0.92,
      });

      const COLLISION = Object.freeze({
        BALL: 1,
        STATIC: 2,
        RIM: 4,
      });

      // ====== Ammo.js 物理引擎 ======
      let AmmoLib = null;
      const physics = {
        ready: false,
        world: null,
        dispatcher: null,
        tmpTransform: null,
        ballShape: null,
        ballBodies: new Set(),
        staticBodies: [],
      };

      const AMMO_CFG = Object.freeze({
        FLOOR_THICK: 0.4,
        WALL_THICK: 0.35,
        BOARD_THICK: 0.06,
        RIM_TUBE_R: 0.01,
        RIM_SEGMENTS: 24,
        MAX_SUB_STEPS: 6,
        FIXED_STEP: 1 / 120,
      });

      function getRimInnerRadius() {
        return Math.max(0.01, WORLD.RIM_R - AMMO_CFG.RIM_TUBE_R);
      }

      function getBallColliderRadius() {
        return physics.ready ? WORLD.BALL_R * PHYS.BALL_COLLIDER_SCALE : WORLD.BALL_R;
      }

      function getScoreRadius() {
        return Math.max(0.01, getRimInnerRadius() - getBallColliderRadius());
      }

      // ====== 剧情与比赛配置 ======
      // 线性剧情：每场比赛前/后触发对话，胜利进入下一场。
      const CAMPAIGN = [
        {
          id: "draft_night",
          title: "选秀之夜",
          tag: "序章",
          pre: [
            { speaker: "旁白", avatar: "📺", text: "镁光灯把夜色照得像白昼。今天，你的名字会被念出来。", },
            { speaker: "经纪人", avatar: "🧑‍💼", text: "别紧张。上场别想太多——把训练馆的手感带到球场。", },
            { speaker: "你", avatar: "🧢", text: "我准备好了。我要让所有人记住：我不只是个“潜力股”。", },
          ],
          match: { opponent: "夏季联赛 · 对抗队", time: 45, target: 14 },
          post: [
            { speaker: "教练", avatar: "🧔‍♂️", text: "不错，菜鸟。你敢投、敢承担，这是好事。下一场，压力会更大。", },
          ],
        },
        {
          id: "bench_role",
          title: "替补席的机会",
          tag: "第1章",
          pre: [
            { speaker: "旁白", avatar: "📰", text: "媒体说你只会靠天赋吃饭。你决定用最朴素的方式回应：得分。", },
            { speaker: "队友", avatar: "😎", text: "别怕打铁，关键是投篮选择。找到你的甜点区，然后狠狠干。", },
          ],
          match: { opponent: "常规赛 · 客场", time: 50, target: 18 },
          post: [
            { speaker: "旁白", avatar: "📈", text: "数据不会说谎。你在有限的上场时间里，打出了“值得更多信任”的表现。", },
          ],
        },
        {
          id: "closing_time",
          title: "关键时刻",
          tag: "第2章",
          pre: [
            { speaker: "教练", avatar: "🧔‍♂️", text: "最后两分钟我把你留在场上。别犹豫——空位就投。", },
            { speaker: "你", avatar: "🧢", text: "给我球。我会做出正确的决定。", },
          ],
          match: { opponent: "常规赛 · 强队", time: 55, target: 22 },
          post: [
            { speaker: "解说", avatar: "🎙️", text: "这位新秀——他不只是敢投，他会在最难的时刻做出最硬的回应！", },
          ],
        },
        {
          id: "leader",
          title: "球队领袖",
          tag: "终章",
          pre: [
            { speaker: "旁白", avatar: "🏟️", text: "更衣室里安静得能听见呼吸。你望向队友：他们在等你开口。", },
            { speaker: "你", avatar: "🧢", text: "我们不会等机会来敲门。我们要把门踢开。——上场，赢下这一场。", },
          ],
          match: { opponent: "季后赛 · 生死战", time: 60, target: 26 },
          post: [
            { speaker: "旁白", avatar: "🏆", text: "从选秀菜鸟到球队领袖，你用每一次出手把故事写进了记分牌。", },
            { speaker: "系统", avatar: "✨", text: "通关！你可以从任意章节重新开始挑战，刷新命中率与记录。", },
          ],
        },
      ];

      const state = {
        mode: "boot", // boot | story | match | result
        chapterIndex: 0,
        storyQueue: [],
        storyPos: 0,
        rating: 60,
        netKick: 0,
        netPhase: 0,
        match: {
          running: false,
          timeLeft: 0,
          score: 0,
          target: 0,
          opponent: "",
          streak: 0,
          shots: 0,
          makes: 0,
        },
        aim: {
          active: false,
          pointerId: null,
          sx: 0,
          sy: 0,
          st: 0,
          cx: 0,
          cy: 0,
          moved: 0,
          startWorld: null,
          previewBall: null,
          longPressTimer: null,
          longPressed: false,
          forceManual: false,
        },
        balls: [],
        effects: [],
        firstPerson: {
          active: false,
          saved: null,
        },
        lastTs: 0,
        lastTick: 0,
      };

      // ====== Canvas / Camera ======
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const camera = {
        pos: vec3(0.0, 4.8, WORLD.COURT_L + 4.2),
        target: vec3(0.0, 3.05, 0.0),
        up: vec3(0, 1, 0),
        f: 900,
        basis: null,
      };

      // 用于将“屏幕坐标 -> 球场平面(x,z)”做精确映射（与地板四边形严格对齐）
      const projectionMap = {
        ready: false,
        dpr: 1,
        H: null,
        Hinv: null,
      };

      function computeCameraBasis() {
        const forward = vnorm(vsub(camera.target, camera.pos));
        const right = vnorm(vcross(forward, camera.up));
        const up = vcross(right, forward);
        camera.basis = { forward, right, up };
      }

      function mat3Invert(m) {
        const a = m[0][0], b = m[0][1], c = m[0][2];
        const d = m[1][0], e = m[1][1], f = m[1][2];
        const g = m[2][0], h = m[2][1], i = m[2][2];
        const A = e * i - f * h;
        const B = -(d * i - f * g);
        const C = d * h - e * g;
        const D = -(b * i - c * h);
        const E = a * i - c * g;
        const F = -(a * h - b * g);
        const G = b * f - c * e;
        const H = -(a * f - c * d);
        const I = a * e - b * d;
        const det = a * A + b * B + c * C;
        if (Math.abs(det) < 1e-10) return null;
        const invDet = 1 / det;
        return [
          [A * invDet, D * invDet, G * invDet],
          [B * invDet, E * invDet, H * invDet],
          [C * invDet, F * invDet, I * invDet],
        ];
      }

      function solveLinearSystem(A, b) {
        const n = b.length;
        const M = A.map((row, r) => row.slice().concat([b[r]]));
        for (let col = 0; col < n; col++) {
          let pivot = col;
          for (let r = col + 1; r < n; r++) {
            if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
          }
          if (Math.abs(M[pivot][col]) < 1e-12) return null;
          if (pivot !== col) {
            const tmp = M[col];
            M[col] = M[pivot];
            M[pivot] = tmp;
          }
          const div = M[col][col];
          for (let c = col; c <= n; c++) M[col][c] /= div;
          for (let r = 0; r < n; r++) {
            if (r === col) continue;
            const factor = M[r][col];
            if (Math.abs(factor) < 1e-12) continue;
            for (let c = col; c <= n; c++) M[r][c] -= factor * M[col][c];
          }
        }
        return M.map((row) => row[n]);
      }

      function computeHomography4(src, dst) {
        // src/dst: [{x,y}] 四对点。返回 3x3 H，使得 dst ~ H * src（齐次）
        const A = [];
        const b = [];
        for (let k = 0; k < 4; k++) {
          const x = src[k].x, y = src[k].y;
          const u = dst[k].x, v = dst[k].y;
          A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]);
          b.push(u);
          A.push([0, 0, 0, x, y, 1, -v * x, -v * y]);
          b.push(v);
        }
        const h = solveLinearSystem(A, b);
        if (!h) return null;
        return [
          [h[0], h[1], h[2]],
          [h[3], h[4], h[5]],
          [h[6], h[7], 1],
        ];
      }

      function applyHomography(H, x, y) {
        const X = H[0][0] * x + H[0][1] * y + H[0][2];
        const Y = H[1][0] * x + H[1][1] * y + H[1][2];
        const W = H[2][0] * x + H[2][1] * y + H[2][2];
        if (Math.abs(W) < 1e-9) return null;
        return { x: X / W, y: Y / W };
      }

      function project(p) {
        const { forward, right, up } = camera.basis;
        const v = vsub(p, camera.pos);
        const xCam = vdot(v, right);
        const yCam = vdot(v, up);
        const zCam = vdot(v, forward);
        if (zCam <= 0.05) return null;
        const sx = canvas.width * 0.5 + (xCam / zCam) * camera.f;
        const sy = canvas.height * 0.58 - (yCam / zCam) * camera.f;
        return { x: sx, y: sy, z: zCam };
      }

      function pxRadius(worldRadius, zCam) {
        return (worldRadius / zCam) * camera.f;
      }

      function resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(2, Math.floor(rect.width * dpr));
        canvas.height = Math.max(2, Math.floor(rect.height * dpr));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        camera.f = Math.min(canvas.width, canvas.height) * 1.05;
        projectionMap.dpr = dpr;
        computeProjectionMap();
      }

      window.addEventListener("resize", resize);
      computeCameraBasis();

      // 延迟初始化：确保页面布局完成后再计算投影矩阵
      // 使用 requestAnimationFrame 确保浏览器已完成布局计算
      function initResize() {
        resize();
        // 再次延迟确保完全正确
        requestAnimationFrame(() => {
          resize();
        });
      }

      if (document.readyState === 'complete') {
        initResize();
      } else {
        window.addEventListener('load', initResize);
      }

      function computeProjectionMap() {
        // 计算“球场平面(x,z) -> 屏幕像素(u,v)”的单应映射，并缓存逆映射用于屏幕->世界
        const hw = WORLD.COURT_W * 0.5;
        const L = WORLD.SHOOT_Z_MAX;
        const zN = -1.4;
        const world = [
          { x: -hw, y: L },
          { x: hw, y: L },
          { x: hw, y: zN },
          { x: -hw, y: zN },
        ];
        const scr = [
          // 用 y = BALL_R 平面建图：这样把“触点屏幕坐标”映射到“篮球中心所在平面”，保证球心贴手指
          project(vec3(-hw, WORLD.BALL_R, L)),
          project(vec3(hw, WORLD.BALL_R, L)),
          project(vec3(hw, WORLD.BALL_R, zN)),
          project(vec3(-hw, WORLD.BALL_R, zN)),
        ];
        if (scr.some((p) => !p)) {
          projectionMap.ready = false;
          projectionMap.H = null;
          projectionMap.Hinv = null;
          return;
        }
        const dst = scr.map((p) => ({ x: p.x, y: p.y }));
        const H = computeHomography4(world, dst);
        const Hinv = H ? mat3Invert(H) : null;
        projectionMap.ready = !!Hinv;
        projectionMap.H = H;
        projectionMap.Hinv = Hinv;
      }

      function openStory(queue) {
        state.mode = "story";

      function renderStoryStep() {
        const total = state.storyQueue.length || 1;
        const idx = clamp(state.storyPos, 0, total - 1);
        const scene = state.storyQueue[idx] || { speaker: "旁白", avatar: "📖", text: "" };
        setOverlayScene(scene, `${idx + 1}/${total}`);
        if (idx !== total - 1) {
          el.btnNext.textContent = "下一句";
          return;
        }
        if (state._afterStory === "advance") {
          el.btnNext.textContent = "进入下一场";
          return;
        }
        if (state._afterStory === "retry") {
          el.btnNext.textContent = "重开本场";

        }
        el.btnNext.textContent = "开始比赛";

      function closeStoryAndStartMatch() {

      function toNextChapterOrFreeplay() {
        if (state.chapterIndex < CAMPAIGN.length - 1) {
          state.chapterIndex += 1;
          openStory(CAMPAIGN[state.chapterIndex].pre);
          return;
        }
        // 通关后：回到第一章（可反复挑战）
        state.chapterIndex = 0;
        openStory(CAMPAIGN[state.chapterIndex].pre);

      // ====== 比赛流程 ======
      function resetMatch() {
        const chapter = CAMPAIGN[state.chapterIndex];
        state.match.running = false;
        state.match.timeLeft = chapter.match.time;
        state.match.score = 0;
        state.match.target = chapter.match.target;
        state.match.opponent = chapter.match.opponent;
        state.match.streak = 0;
        state.match.shots = 0;
        state.match.makes = 0;

        state.aim.active = false;
        state.aim.previewBall = null;
